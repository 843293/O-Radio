[platformio]
default_envs = sts_6686n3

[env:sts_6686n3]
platform = espressif32 @ 8.0.0
board = esp32-s3-devkitc-1
framework = arduino

board_build.partitions = partitions.csv
board_build.filesystem = spiffs
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_build.f_cpu = 240000000L
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB

upload_speed = 921600
monitor_speed = 115200

lib_deps =
    bodmer/TFT_eSPI @ 2.5.43
    https://github.com/schreibfaul1/ESP32-audioI2S.git#8b4bbbdef5b993acc30139046d3e5abb4dd354dc
    bblanchon/ArduinoJson @ 7.4.2

build_flags =
    -Wl,--wrap=i2s_channel_init_std_mode
    -Wl,--wrap=i2s_channel_reconfig_std_clock
    -Wl,--wrap=i2s_channel_reconfig_std_slot
    -Wl,--wrap=i2s_channel_write
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D BOARD_HAS_PSRAM
    -D USER_SETUP_LOADED=1
    -D USE_FSPI_PORT=1
    -D ST7789_DRIVER=1
    -D TFT_RGB_ORDER=0
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_MISO=18
    -D TFT_MOSI=4
    -D TFT_SCLK=8
    -D TFT_CS=38
    -D TFT_DC=16
    -D TFT_RST=17
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D SMOOTH_FONT=1
    -D SPI_FREQUENCY=40000000
    -D SPI_READ_FREQUENCY=20000000
